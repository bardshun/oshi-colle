<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンバー・グループ管理 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans">
  
  <!-- タイムテーブル風 共通ヘッダー -->
  <header id="app-header"></header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto p-4 space-y-6">
    
    <!-- ナビゲーションタブ -->
    <div class="flex border-b border-slate-800 text-sm font-bold gap-2">
      <button id="tab-btn-members" onclick="switchTab('members')" class="pb-3 px-4 border-b-2 border-pink-500 text-pink-400 transition">👥 メンバー一覧</button>
      <button id="tab-btn-groups" onclick="switchTab('groups')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">🏢 グループ一覧</button>
      <button id="tab-btn-active" onclick="switchTab('active')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">👁️ ユーザー表示設定</button>
    </div>

    <!-- TAB 1: メンバー一覧 -->
    <section id="tab-content-members" class="space-y-4">
      <!-- フィルター・コントロールパネル -->
      <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-3">
        
        <!-- 1. 最上段（常時表示）：検索 ＆ メンバー追加 ＆ 絞り込みトグル -->
        <div class="flex items-center gap-2">
          <!-- 検索インプット -->
          <input type="text" id="search-input" oninput="filterMembers()" placeholder="🔍 メンバー名・グループ名..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-500 flex-1 min-w-0">

          <!-- 💡 常時表示のメンバー追加ボタン -->
          <button onclick="openMemberModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3 py-2 rounded-xl transition shadow-[0_0_12px_rgba(236,72,153,0.4)] flex items-center gap-1 shrink-0 whitespace-nowrap">
            <span>＋</span> メンバー追加
          </button>

          <!-- 💡 絞り込み開閉ボタン -->
          <button onclick="toggleFilterPanel()" id="toggle-filter-btn" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 whitespace-nowrap">
            <span>⚙️ 絞り込み</span>
            <span id="filter-arrow-icon" class="text-[10px] transition-transform duration-200">▼</span>
          </button>
        </div>

        <!-- 2. 開閉対象のフィルター詳細パネル -->
        <div id="filter-details-panel" class="space-y-3 pt-2 border-t border-slate-800/80 transition-all duration-300">
          
          <!-- 各種セレクトフィルター（折り返し対応） -->
          <div class="flex flex-wrap gap-2 text-xs">
            <!-- ソート -->
            <select id="sort-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[130px]">
              <option value="name_asc">🔤 名前順（五十音）</option>
              <option value="group_asc">🏢 グループ順</option>
              <option value="created_desc">🆕 登録順（新しい順）</option>
              <option value="created_asc">⏳ 登録順（古い順）</option>
            </select>

            <!-- グループフィルター -->
            <select id="group-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[130px]">
              <option value="">🏢 すべてのグループ</option>
            </select>

            <!-- 区分フィルター -->
            <select id="category-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[120px]">
              <option value="">🏷️ すべての区分</option>
              <option value="idol">アイドル</option>
              <option value="concept_cafe">コンカフェ</option>
              <option value="other">その他</option>
            </select>

            <!-- 拠点フィルター -->
            <select id="prefecture-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[120px]">
              <option value="">📍 すべての拠点</option>
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>

            <!-- ユーザー表示設定（ON / OFF） -->
            <select id="visibility-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[130px]">
              <option value="visible" selected>👁️ 表示設定: ONのみ</option>
              <option value="hidden">🙈 表示設定: OFF（非表示のみ）</option>
              <option value="all">🌐 表示設定: すべて表示</option>
            </select>
          </div>

          <!-- 下段：状態チェックボックス ＆ 表示サイズ切り替え -->
          <div class="flex flex-wrap justify-between items-center gap-3 pt-2 border-t border-slate-800/60">
            <!-- ステータス（現役・卒業）チェックボックス -->
            <div class="flex items-center space-x-4 text-xs">
              <label class="flex items-center space-x-1.5 cursor-pointer text-slate-300">
                <input type="checkbox" id="status-active-chk" checked onchange="filterMembers()" class="accent-pink-500 rounded">
                <span>現役</span>
              </label>
              <label class="flex items-center space-x-1.5 cursor-pointer text-slate-400">
                <input type="checkbox" id="status-graduated-chk" onchange="filterMembers()" class="accent-pink-500 rounded">
                <span>卒業 / 離籍</span>
              </label>
            </div>

            <!-- サイズ切替ボタン -->
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] font-bold ml-auto">
              <button id="size-btn-sm" onclick="changeCardSize('sm')" class="px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">小</button>
              <button id="size-btn-md" onclick="changeCardSize('md')" class="px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">中</button>
              <button id="size-btn-lg" onclick="changeCardSize('lg')" class="px-2 py-1 rounded-lg bg-pink-600 text-white transition">大</button>
            </div>
          </div>

        </div>
      </div>

      <!-- メンバーカードグリッド -->
      <div id="members-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- JSでメンバーカード生成 -->
      </div>
    </section>

    <!-- TAB 2: グループ一覧 -->
    <section id="tab-content-groups" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">登録済みグループ</h2>
        <button onclick="openGroupModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-[0_0_12px_rgba(168,85,247,0.4)] flex items-center gap-1">
          <span>＋</span> グループ追加
        </button>
      </div>

      <div id="groups-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <!-- JSでグループカード生成 -->
      </div>
    </section>

    <!-- TAB 3: ユーザー表示設定 -->
    <section id="tab-content-active" class="space-y-4 hidden">
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 class="text-base font-bold text-pink-400">👁 プレイ用表示設定</h2>
          <p class="text-xs text-slate-400">Tier表や共通点ゲームで使用したいグループ・メンバーのみチェックを入れてください。</p>
        </div>

        <!-- 💡 明示的な一括保存ボタン -->
        <button onclick="saveUserMemberSettings()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-[0_0_12px_rgba(236,72,153,0.4)] shrink-0 flex items-center gap-1">
          <span>💾</span> 設定を保存
        </button>
      </div>

      <!-- グループ・メンバー一覧コンテナ -->
      <div id="active-management-list" class="space-y-4">
        <!-- JSで生成 -->
      </div>
    </section>

  </main>

  <!-- ==================== モーダル1: メンバー登録・編集 ==================== -->
  <div id="member-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="font-bold text-lg text-pink-400">メンバーを追加</h3>
        <button onclick="closeMemberModal()" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>

      <form id="member-form" onsubmit="saveMember(event)" class="space-y-4">
        <input type="hidden" id="member-id">

        <!-- 画像アップロード・プレビュー領域 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">顔写真 (メイン画像)</label>
          <div id="member-paste-area" class="border-2 border-dashed border-slate-700 hover:border-pink-500 rounded-xl p-4 text-center cursor-pointer transition relative bg-slate-950">
            <img id="image-preview" class="max-h-40 mx-auto rounded-lg mb-2 hidden object-cover" src="" alt="preview">
            <div id="upload-placeholder" class="space-y-1">
              <div class="text-2xl">📷</div>
              <p class="text-xs text-slate-300 font-bold">ファイルをドロップ または 長押しペースト</p>
              <p class="text-[10px] text-slate-500">クリックしてアルバムから選択</p>
            </div>
            <input type="file" id="image-file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleMemberFileSelect(event)">
          </div>
          <button type="button" onclick="pasteFromClipboard('member')" class="mt-2 w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg border border-slate-700 transition">
            📋 クリップボードから画像を貼り付け
          </button>
        </div>

        <!-- 名前 & ふりがな(ruby) -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">名前 <span class="text-pink-500">*</span></label>
            <input type="text" id="member-name" required placeholder="例: さくら" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">ふりがな</label>
            <input type="text" id="member-ruby" placeholder="例: さくら" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>
        </div>

        <!-- 所属グループ -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-slate-400">所属グループ / 店舗</label>
            <button type="button" onclick="openGroupModal()" class="text-xs text-pink-400 hover:underline">＋ 新規グループ追加</button>
          </div>
          <select id="member-group" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500 text-slate-200">
            <option value="">未所属・フリー</option>
          </select>
        </div>
        <!-- 区分（個別設定・上書き用） -->
        <div>
          <label class="block text-[10px] font-bold text-slate-400 mb-1">区分（グループ設定を上書きする場合のみ選択）</label>
          <select id="member-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
            <option value="">🏢 グループの設定に従う</option>
            <option value="idol">アイドル</option>
            <option value="concept_cafe">コンカフェ</option>
            <option value="other">その他</option>
          </select>
        </div>

        <!-- 拠点都道府県（個別設定・上書き用） -->
        <div>
          <label class="block text-[10px] font-bold text-slate-400 mb-1">メイン活動拠点（グループ設定を上書きする場合のみ選択）</label>
          <select id="member-prefecture" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
            <option value="">📍 グループの設定に従う</option>
            <option value="東京都">東京都</option>
            <option value="大阪府">大阪府</option>
            <option value="愛知県">愛知県</option>
            <option value="福岡県">福岡県</option>
            <option value="北海道">北海道</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <!-- 状態 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">状態</label>
          <div class="flex space-x-4 text-sm">
            <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="member-status" value="active" checked class="accent-pink-500"> <span>現役</span></label>
            <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="member-status" value="graduated" class="accent-pink-500"> <span>卒業 / 離籍</span></label>
          </div>
        </div>

        <!-- 属性タグ -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">属性タグ (カンマ区切り)</label>
          <input type="text" id="member-tags" placeholder="例: 黒髪, ボブ, ショート" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
        </div>

        <!-- ボタン類 -->
        <div class="flex space-x-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeMemberModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-sm font-bold transition">キャンセル</button>
          <button type="submit" id="save-btn" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-2 rounded-xl text-sm transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== モーダル2: グループ登録・編集 (貼り付け対応) ==================== -->
  <div id="group-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 id="group-modal-title" class="font-bold text-md text-purple-400">グループ / 店舗を追加</h3>
        <button onclick="closeGroupModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="group-form" onsubmit="saveGroup(event)" class="space-y-3">
        <input type="hidden" id="group-id">
        
        <!-- グループ名 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">名称 <span class="text-pink-500">*</span></label>
          <input type="text" id="group-name" required placeholder="例: 〇〇少女隊" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
        </div>

        <!-- グループ画像（ペースト対応） -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">グループ画像 (ロゴ / 集合写真)</label>
          <div id="group-paste-area" class="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl p-3 text-center cursor-pointer transition relative bg-slate-950">
            <img id="group-image-preview" class="max-h-32 mx-auto rounded-lg mb-2 hidden object-cover" src="" alt="group preview">
            <div id="group-upload-placeholder" class="space-y-1">
              <div class="text-xl">🖼️</div>
              <p class="text-xs text-slate-300 font-bold">ファイルをドロップ または 長押しペースト</p>
              <p class="text-[10px] text-slate-500">クリックしてファイルを選択</p>
            </div>
            <input type="file" id="group-image-file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleGroupFileSelect(event)">
          </div>
          <button type="button" onclick="pasteFromClipboard('group')" class="mt-2 w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg border border-slate-700 transition">
            📋 クリップボードから画像を貼り付け
          </button>
        </div>

        <!-- 区分 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">区分</label>
          <select id="group-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none text-slate-200">
            <option value="idol">アイドル</option>
            <option value="concept_cafe">コンカフェ</option>
            <option value="other">その他</option>
          </select>
        </div>

        <!-- 拠点 & エリア補足 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">拠点都道府県</label>
            <select id="group-prefecture" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs focus:outline-none text-slate-200">
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">エリア補足</label>
            <input type="text" id="group-area-note" placeholder="例: 秋葉原" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs focus:outline-none">
          </div>
        </div>

        <!-- ボタン -->
        <div class="flex space-x-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeGroupModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-bold">キャンセル</button>
          <button type="button" onclick="saveGroup(event)" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl text-xs transition">登録・保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
