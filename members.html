<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンバー・グループ管理 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans">
  
  <!-- 共通ヘッダー -->
  <header id="app-header"></header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto p-4 space-y-6">
    
    <!-- ナビゲーションタブ -->
    <div class="flex border-b border-slate-800 text-sm font-bold gap-2">
      <button id="tab-btn-members" onclick="switchTab('members')" class="pb-3 px-4 border-b-2 border-pink-500 text-pink-400 transition">👥 メンバー一覧・追加</button>
      <button id="tab-btn-groups" onclick="switchTab('groups')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">🏢 グループ一覧・追加</button>
      <button id="tab-btn-active" onclick="switchTab('active')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">👁️ ユーザー表示設定</button>
    </div>

    <!-- TAB 1: メンバー一覧・登録 -->
    <section id="tab-content-members" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">登録済みメンバー</h2>
        <button onclick="openMemberModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-[0_0_12px_rgba(236,72,153,0.4)] flex items-center gap-1">
          <span>＋</span> メンバー追加
        </button>
      </div>

      <div id="members-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- JSでメンバーカード生成 -->
      </div>
    </section>

    <!-- TAB 2: グループ一覧・登録 -->
    <section id="tab-content-groups" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">登録済みグループ</h2>
        <button onclick="openGroupModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-[0_0_12px_rgba(168,85,247,0.4)] flex items-center gap-1">
          <span>＋</span> グループ追加
        </button>
      </div>

      <div id="groups-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <!-- JSでグループカード生成 -->
      </div>
    </section>

    <!-- TAB 3: ユーザー表示・非表示管理 -->
    <section id="tab-content-active" class="space-y-4 hidden">
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 space-y-2">
        <h2 class="text-base font-bold text-pink-400">👁️ プレイ用アクティブ選択</h2>
        <p class="text-xs text-slate-400">マスタデータから、Tier表や共通点ゲームで使用したいグループ・メンバーのチェックをONにしてください。</p>
      </div>

      <div id="active-management-list" class="space-y-4">
        <!-- JSでグループごとのチェックリスト生成 -->
      </div>
    </section>

  </main>

  <!-- モーダル: メンバー登録・編集 -->
  <div id="member-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="member-modal-title" class="font-bold text-slate-100">メンバー登録</h3>
        <button onclick="closeMemberModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form id="member-form" onsubmit="saveMember(event)" class="space-y-3">
        <input type="hidden" id="member-id">
        <div>
          <label class="block text-xs text-slate-400 mb-1">メンバー名 *</label>
          <input type="text" id="member-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">所属グループ *</label>
          <select id="member-group" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500 text-slate-200">
            <!-- JSで選択肢挿入 -->
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">メンバー画像</label>
          <input type="file" id="member-image-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-slate-800 file:text-pink-400 hover:file:bg-slate-700">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeMemberModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl font-bold">キャンセル</button>
          <button type="submit" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white text-xs rounded-xl font-bold">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル: グループ登録・編集 -->
  <div id="group-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="group-modal-title" class="font-bold text-slate-100">グループ登録</h3>
        <button onclick="closeGroupModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form id="group-form" onsubmit="saveGroup(event)" class="space-y-3">
        <input type="hidden" id="group-id">
        <div>
          <label class="block text-xs text-slate-400 mb-1">グループ名 *</label>
          <input type="text" id="group-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">拠点（例: 東京都）</label>
          <input type="text" id="group-location" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">グループ画像（ロゴ/集合写真など）</label>
          <input type="file" id="group-image-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-slate-800 file:text-purple-400 hover:file:bg-slate-700">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeGroupModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl font-bold">キャンセル</button>
          <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs rounded-xl font-bold">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
