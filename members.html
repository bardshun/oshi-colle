<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンバー管理 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-20">
  
  <!-- 全画面共通ヘッダー -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-gray-400 hover:text-white transition">🏠</a>
        <h1 class="text-xl font-bold text-pink-500">👥 メンバー管理</h1>
      </div>
      <button onclick="openMemberModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-3 py-1.5 rounded-lg text-sm transition">
        ＋ メンバー追加
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto p-4 space-y-4">
    
    <!-- 検索 & フィルターエリア -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
      <!-- 検索入力 -->
      <div>
        <input type="text" id="search-input" oninput="filterMembers()" placeholder="🔍 メンバー名・グループ名で検索..." 
               class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
      </div>
      
      <!-- フィルター群 -->
      <div class="flex flex-wrap gap-2 text-xs">
        <select id="group-filter" onchange="filterMembers()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 focus:outline-none text-gray-300">
          <option value="">🏢 すべてのグループ/店舗</option>
        </select>
        <select id="status-filter" onchange="filterMembers()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 focus:outline-none text-gray-300">
          <option value="">⚪︎ すべての状態</option>
          <option value="active" selected>現役のみ</option>
          <option value="graduated">卒業/離籍のみ</option>
        </select>
      </div>
    </div>

    <!-- メンバーカードグリッドエリア -->
    <div id="member-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
      <!-- JavaScriptで動的にカードを差し込みます -->
      <div class="col-span-full text-center py-10 text-gray-500">読み込み中...</div>
    </div>
  </main>

  <!-- ==================== モーダル1: メンバー登録・編集 ==================== -->
  <div id="member-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 id="modal-title" class="font-bold text-lg text-pink-400">メンバーを追加</h3>
        <button onclick="closeMemberModal()" class="text-gray-400 hover:text-white text-xl">✕</button>
      </div>

      <form id="member-form" onsubmit="saveMember(event)" class="space-y-4">
        <input type="hidden" id="member-id">

        <!-- 画像アップロード・プレビュー領域 -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">顔写真 (メイン画像)</label>
          <div id="paste-area" class="border-2 border-dashed border-gray-600 hover:border-pink-500 rounded-xl p-4 text-center cursor-pointer transition relative bg-gray-900">
            <img id="image-preview" class="max-h-40 mx-auto rounded-lg mb-2 hidden object-cover" src="" alt="preview">
            <div id="upload-placeholder" class="space-y-1">
              <div class="text-2xl">📷</div>
              <p class="text-xs text-gray-300 font-bold">ファイルをドロップ または 長押しペースト</p>
              <p class="text-[10px] text-gray-500">クリックしてアルバムから選択</p>
            </div>
            <input type="file" id="image-file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
          </div>
          <button type="button" onclick="pasteFromClipboard()" class="mt-2 w-full text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 py-1.5 rounded-lg border border-gray-600 transition">
            📋 クリップボードから画像を貼り付け
          </button>
        </div>

        <!-- 名前 & ふりがな -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-gray-400 mb-1">名前 <span class="text-pink-500">*</span></label>
            <input type="text" id="member-name" required placeholder="例: さくら" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">ふりがな</label>
            <input type="text" id="member-ruby" placeholder="例: さくら" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>
        </div>

        <!-- 所属グループ -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-gray-400">所属グループ / 店舗</label>
            <button type="button" onclick="openGroupModal()" class="text-xs text-pink-400 hover:underline">＋ 新規グループ追加</button>
          </div>
          <select id="member-group" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500 text-white">
            <option value="">未所属・フリー</option>
          </select>
        </div>

        <!-- 状態 -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">状態</label>
          <div class="flex space-x-4 text-sm">
            <label class="flex items-center space-x-1"><input type="radio" name="member-status" value="active" checked class="accent-pink-500"> <span>現役</span></label>
            <label class="flex items-center space-x-1"><input type="radio" name="member-status" value="graduated" class="accent-pink-500"> <span>卒業 / 離籍</span></label>
          </div>
        </div>

        <!-- 属性タグ -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">属性タグ (カンマ区切り)</label>
          <input type="text" id="member-tags" placeholder="例: 黒髪, ボブ, ショート" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
        </div>

        <!-- ボタン類 -->
        <div class="flex space-x-2 pt-2 border-t border-gray-700">
          <button type="button" onclick="closeMemberModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 rounded-lg text-sm transition">キャンセル</button>
          <button type="submit" id="save-btn" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-2 rounded-lg text-sm transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== モーダル2: グループ新規作成 ==================== -->
  <div id="group-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[60] hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-sm p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h3 class="font-bold text-md text-pink-400">グループ / 店舗を追加</h3>
        <button onclick="closeGroupModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="group-form" onsubmit="saveGroup(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">名称 <span class="text-pink-500">*</span></label>
          <input type="text" id="group-name" required placeholder="例: 〇〇少女隊" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">区分</label>
          <select id="group-category" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
            <option value="idol">アイドル</option>
            <option value="concept_cafe">コンカフェ</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-gray-400 mb-1">拠点都道府県</label>
            <select id="group-prefecture" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-2 text-xs focus:outline-none">
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">エリア補足</label>
            <input type="text" id="group-area-note" placeholder="例: 秋葉原" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-2 text-xs focus:outline-none">
          </div>
        </div>

        <div class="flex space-x-2 pt-2">
          <button type="button" onclick="closeGroupModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 py-1.5 rounded-lg text-xs">キャンセル</button>
          <button type="submit" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-1.5 rounded-lg text-xs">登録する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
