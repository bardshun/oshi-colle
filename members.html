<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンバー・グループ管理 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans">
  
  <!-- タイムテーブル風 共通ヘッダー -->
  <header id="app-header"></header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto p-4 space-y-6">
    
    <!-- ナビゲーションタブ -->
    <div class="flex border-b border-slate-800 text-sm font-bold gap-2">
      <button id="tab-btn-members" onclick="switchTab('members')" class="pb-3 px-4 border-b-2 border-pink-500 text-pink-400 transition">👥 メンバー一覧</button>
      <button id="tab-btn-groups" onclick="switchTab('groups')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">🏢 グループ一覧</button>
      <button id="tab-btn-active" onclick="switchTab('active')" class="pb-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">👁️ ユーザー表示設定</button>
    </div>

    <!-- TAB 1: メンバー一覧 -->
    <section id="tab-content-members" class="space-y-3">
      <!-- フィルター・コントロールパネル -->
      <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2.5">
        
        <!-- 1. 最上段（常時表示）：検索 ＆ メンバー追加 ＆ 絞り込みトグル -->
        <div class="flex items-center gap-2">
          <!-- 検索インプット -->
          <input type="text" id="search-input" oninput="filterMembers()" placeholder="🔍 メンバー名・グループ名..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-500 flex-1 min-w-0">

          <!-- 常時表示のメンバー追加ボタン -->
          <button onclick="openMemberModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3 py-2 rounded-xl transition shadow-[0_0_12px_rgba(236,72,153,0.4)] flex items-center gap-1 shrink-0 whitespace-nowrap">
            <span>＋</span> 追加
          </button>

          <!-- 絞り込み開閉ボタン -->
          <button onclick="toggleFilterPanel()" id="toggle-filter-btn" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 px-2.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 whitespace-nowrap">
            <span>⚙️ 絞り込み</span>
            <span id="filter-arrow-icon" class="text-[10px] transition-transform duration-200">▼</span>
          </button>
        </div>

        <!-- 2. 開閉対象のフィルター詳細パネル -->
        <div id="filter-details-panel" class="space-y-2.5 pt-2 border-t border-slate-800/80 transition-all duration-300">
          
          <!-- 各種セレクトフィルター（折り返し対応） -->
          <div class="flex flex-wrap gap-2 text-xs">
            <!-- ソート -->
            <select id="sort-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[120px]">
              <option value="name_asc">🔤 名前順</option>
              <option value="group_asc">🏢 グループ順</option>
              <option value="color_asc">🎨 カラー順</option>
              <option value="created_desc">🆕 登録順（新）</option>
              <option value="created_asc">⏳ 登録順（古）</option>
            </select>

            <!-- グループフィルター -->
            <select id="group-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[120px]">
              <option value="">🏢 すべてのグループ</option>
            </select>

            <!-- 区分フィルター -->
            <select id="category-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[110px]">
              <option value="">🏷️ すべての区分</option>
            </select>

            <!-- 拠点フィルター -->
            <select id="prefecture-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[110px]">
              <option value="">📍 すべての拠点</option>
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>

            <!-- ユーザー表示設定（ON / OFF） -->
            <select id="visibility-filter" onchange="filterMembers()" class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 focus:outline-none text-slate-300 flex-1 min-w-[120px]">
              <option value="visible" selected>👁️ 表示: ONのみ</option>
              <option value="hidden">🙈 表示: OFFのみ</option>
              <option value="all">🌐 すべて表示</option>
            </select>
          </div>

          <!-- 💡 担当カラー横スクロール・パレットフィルター -->
          <div class="flex items-center gap-1.5 overflow-x-auto py-1 scrollbar-none text-xs">
            <span class="text-[10px] text-slate-400 font-bold shrink-0">カラー:</span>
            
            <!-- 全選択 / 全解除ボタン -->
            <button type="button" onclick="toggleAllColorFilters(true)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 transition">全選択</button>
            <button type="button" onclick="toggleAllColorFilters(false)" class="bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 transition">解除</button>
            <div class="w-px h-4 bg-slate-800 shrink-0 mx-0.5"></div>

            <!-- 丸型カラーボタン（data-color と active クラスで状態管理） -->
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="red" class="color-filter-pill w-7 h-7 rounded-full bg-red-600/40 border-2 border-red-500 flex items-center justify-center text-xs shrink-0 transition shadow">🔴</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="blue" class="color-filter-pill w-7 h-7 rounded-full bg-blue-600/40 border-2 border-blue-500 flex items-center justify-center text-xs shrink-0 transition shadow">🔵</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="green" class="color-filter-pill w-7 h-7 rounded-full bg-emerald-600/40 border-2 border-emerald-500 flex items-center justify-center text-xs shrink-0 transition shadow">🟢</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="yellow" class="color-filter-pill w-7 h-7 rounded-full bg-amber-500/40 border-2 border-amber-400 flex items-center justify-center text-xs shrink-0 transition shadow">🟡</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="pink" class="color-filter-pill w-7 h-7 rounded-full bg-pink-600/40 border-2 border-pink-500 flex items-center justify-center text-xs shrink-0 transition shadow">🩷</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="purple" class="color-filter-pill w-7 h-7 rounded-full bg-purple-600/40 border-2 border-purple-500 flex items-center justify-center text-xs shrink-0 transition shadow">💜</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="orange" class="color-filter-pill w-7 h-7 rounded-full bg-orange-600/40 border-2 border-orange-500 flex items-center justify-center text-xs shrink-0 transition shadow">🟠</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="white" class="color-filter-pill w-7 h-7 rounded-full bg-slate-200/40 border-2 border-slate-300 flex items-center justify-center text-xs shrink-0 transition shadow">⚪</button>
            <button type="button" onclick="toggleColorFilterBtn(this)" data-color="black" class="color-filter-pill w-7 h-7 rounded-full bg-slate-800 border-2 border-slate-500 flex items-center justify-center text-xs shrink-0 transition shadow">⚫</button>
          </div>

          <!-- 💡 下段：現役・卒業 ＆ 🎨(絵文字のみ) ＆ 小中大 を1行に収める -->
          <div class="flex justify-between items-center gap-2 pt-2 border-t border-slate-800/60 text-xs">
            
            <!-- ステータス（現役・卒業） -->
            <div class="flex items-center space-x-3 shrink-0">
              <label class="flex items-center space-x-1 cursor-pointer text-slate-300">
                <input type="checkbox" id="status-active-chk" checked onchange="filterMembers()" class="accent-pink-500 rounded">
                <span>現役</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer text-slate-400">
                <input type="checkbox" id="status-graduated-chk" onchange="filterMembers()" class="accent-pink-500 rounded">
                <span>卒業</span>
              </label>
            </div>

            <!-- 💡 カードカラー着色トグル（絵文字のみ & アイコン風） -->
            <button type="button" id="card-color-toggle-btn" onclick="toggleCardColorState()" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 px-2.5 py-1 rounded-xl text-sm transition shrink-0" title="カード着色 ON/OFF">
              🎨 <span id="color-status-text" class="text-[10px] font-bold text-pink-400">ON</span>
            </button>

            <!-- サイズ切替ボタン（小・中・大） -->
            <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[11px] font-bold shrink-0">
              <button id="size-btn-sm" onclick="changeCardSize('sm')" class="px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">小</button>
              <button id="size-btn-md" onclick="changeCardSize('md')" class="px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">中</button>
              <button id="size-btn-lg" onclick="changeCardSize('lg')" class="px-2 py-1 rounded-lg bg-pink-600 text-white transition">大</button>
            </div>

          </div>

        </div>
      </div>

      <!-- メンバーカードグリッド -->
      <div id="members-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- JSでメンバーカード生成 -->
      </div>
    </section>

    <!-- TAB 2: グループ一覧 -->
    <section id="tab-content-groups" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-200">登録済みグループ</h2>
        <button onclick="openGroupModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-[0_0_12px_rgba(168,85,247,0.4)] flex items-center gap-1">
          <span>＋</span> グループ追加
        </button>
      </div>

      <!-- 💡 追加：並び替え選択 ＆ 固定インデックスジャンプバー -->
      <div class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border border-slate-800 rounded-2xl p-3 shadow-xl space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-300">表示形式：</span>
          <select id="group-sort-mode" onchange="renderGroups()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-purple-500">
            <option value="kana">あいうえお順（フラット）</option>
            <option value="prefecture">拠点（都道府県）別</option>
            <option value="category">区分別</option>
          </select>
        </div>

        <!-- インデックスジャンプバー（先頭にTOPボタン） -->
        <div id="group-index-jump-bar" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs whitespace-nowrap scrollbar-thin">
          <button onclick="scrollToGroupTop()" class="px-3 py-1 bg-slate-800 hover:bg-purple-600 text-slate-200 hover:text-white rounded-lg font-bold transition flex-shrink-0 border border-slate-700">
            TOP
          </button>
          <!-- JSで各グループへのジャンプボタンが動的追加されます -->
        </div>
      </div>

      <!-- 💡 変更：グループリストのコンテナ -->
      <div id="groups-list" class="space-y-6">
        <!-- JSでグループまたはセクションが生成されます -->
      </div>
    </section>

    <!-- TAB 3: ユーザー表示設定 -->
    <section id="tab-content-active" class="space-y-4 hidden">
      <!-- 💡 上部に固定（Sticky）するヘッダーエリア（説明文・保存ボタン・切替・インデックスジャンプ） -->
      <div class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
        <div class="flex flex-wrap justify-between items-center gap-3">
          <div>
            <h2 class="text-base font-bold text-pink-400">👁 プレイ用表示設定</h2>
            <p class="text-xs text-slate-400">Tier表や共通点ゲームで使用したいグループ・メンバーのみチェックを入れてください。</p>
          </div>

          <!-- 明示的な一括保存ボタン（常時アクセス可能） -->
          <button onclick="saveUserMemberSettings()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-[0_0_12px_rgba(236,72,153,0.4)] shrink-0 flex items-center gap-1">
            <span>💾</span> 設定を保存
          </button>
        </div>

        <!-- 並び替え切替 ＆ インデックスジャンプバー -->
        <div class="pt-2 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-300">表示形式：</span>
            <select id="active-sort-mode" onchange="renderActiveManagement()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-pink-500">
              <option value="kana">あいうえお順（フラット）</option>
              <option value="prefecture">拠点（都道府県）別</option>
              <option value="category">区分別</option>
            </select>
          </div>

          <!-- インデックスジャンプバー（先頭にTOPボタン） -->
          <div id="active-index-jump-bar" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs whitespace-nowrap scrollbar-thin">
            <button onclick="scrollToActiveTop()" class="px-3 py-1 bg-slate-800 hover:bg-pink-600 text-slate-200 hover:text-white rounded-lg font-bold transition flex-shrink-0 border border-slate-700">
              TOP
            </button>
          </div>
        </div>
      </div>

      <!-- スクロール可能なグループ・メンバー一覧コンテナ -->
      <div id="active-management-list" class="space-y-4 pt-2">
        <!-- JSで生成 -->
      </div>
    </section>

  </main>

  <!-- ==================== モーダル1: メンバー登録・編集 ==================== -->
  <div id="member-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 pt-16 sm:pt-20 hidden">
    <!-- モーダル本体: max-h も少し調整して画面内に収まるようにしています -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- モーダルヘッダー -->
      <div class="flex justify-between items-center border-b border-slate-800 p-4 pb-3 bg-slate-900 shrink-0">
        <h3 id="modal-title" class="font-bold text-lg text-pink-400">メンバーを追加</h3>
        <button type="button" onclick="closeMemberModal()" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>

      <!-- 💡 固定スクロールリンクナビ -->
      <div class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur-sm border-b border-slate-800 px-3 py-2 flex justify-around gap-1 shrink-0 text-xs font-bold">
        <button type="button" onclick="scrollToMemberSection('sec-basic')" class="flex-1 py-1.5 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center gap-1">
          <span>👤</span> 基本情報
        </button>
        <button type="button" onclick="scrollToMemberSection('sec-detail')" class="flex-1 py-1.5 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center gap-1">
          <span>🎨</span> 詳細・カラー
        </button>
        <button type="button" onclick="scrollToMemberSection('sec-personal')" class="flex-1 py-1.5 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center gap-1">
          <span>🔒</span> 自分メモ
        </button>
      </div>

      <!-- スクロール可能なフォーム領域 -->
      <form id="member-form" onsubmit="saveMember(event)" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth">
        <input type="hidden" id="member-id">

        <!-- ================================================= -->
        <!-- 👤 1. 基本情報セクション                          -->
        <!-- ================================================= -->
        <section id="sec-basic" class="space-y-4 pt-1">
          <div class="flex items-center gap-2 pb-1 border-b border-slate-800">
            <span class="text-sm">👤</span>
            <h4 class="text-xs font-extrabold text-pink-400 tracking-wide uppercase">1. 基本情報</h4>
          </div>

          <!-- 顔写真 (複数登録・❤メイン切替) -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">顔写真 (複数登録可能・❤でメイン切替)</label>
            
            <div id="member-image-banner-container" class="relative bg-slate-950 border border-slate-800 rounded-xl overflow-hidden mb-2 hidden">
              <div class="relative h-44 flex items-center justify-center bg-black/40">
                <img id="banner-preview-img" class="max-h-44 mx-auto object-contain" src="" alt="member image">
                
                <button type="button" onclick="prevMemberImage()" class="absolute left-2 bg-black/60 hover:bg-black/80 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs transition">◀</button>
                <button type="button" onclick="nextMemberImage()" class="absolute right-2 bg-black/60 hover:bg-black/80 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs transition">▶</button>
                
                <button type="button" id="set-favorite-btn" onclick="toggleCurrentAsFavorite()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-slate-400 p-1.5 rounded-full text-sm transition shadow" title="この画像をお気に入りに設定">
                  🤍
                </button>
                
                <button type="button" onclick="removeCurrentMemberImage()" class="absolute top-2 left-2 bg-slate-900/80 hover:bg-red-900/80 text-slate-400 hover:text-white p-1.5 rounded-full text-xs transition shadow" title="この画像を削除">
                  🗑️
                </button>
              </div>
              
              <div class="py-2 bg-slate-900/90 flex flex-col items-center justify-center gap-1 border-t border-slate-800">
                <div id="image-dots-container" class="flex space-x-1.5"></div>
                <span id="image-counter-text" class="text-[10px] text-slate-400">1 / 1 枚</span>
              </div>
            </div>

            <div id="member-paste-area" class="border-2 border-dashed border-slate-700 hover:border-pink-500 rounded-xl p-3 text-center cursor-pointer transition relative bg-slate-950">
              <div id="upload-placeholder" class="space-y-1">
                <div class="text-xl">📷</div>
                <p class="text-xs text-slate-300 font-bold">画像を追加（ドロップ または ペースト）</p>
                <p class="text-[10px] text-slate-500">クリックしてアルバムから選択</p>
              </div>
              <input type="file" id="image-file-input" accept="image/*" multiple class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleMemberFileSelect(event)">
            </div>
            
            <button type="button" onclick="pasteFromClipboard('member')" class="mt-2 w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg border border-slate-700 transition">
              📋 クリップボードから画像を貼り付け
            </button>
          </div>

          <!-- 名前 & ふりがな -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-400 mb-1">名前 <span class="text-pink-500">*</span></label>
              <input type="text" id="member-name" required placeholder="例: さくら" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">ふりがな</label>
              <input type="text" id="member-ruby" placeholder="例: さくら" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
            </div>
          </div>

          <!-- 所属グループ -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs text-slate-400">所属グループ / 店舗</label>
              <button type="button" onclick="openGroupModal()" class="text-xs text-pink-400 hover:underline">＋ 新規グループ追加</button>
            </div>
            <select id="member-group" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500 text-slate-200">
              <option value="">未所属・フリー</option>
            </select>
          </div>

          <!-- 区分（上書き用） -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">区分（グループ設定を上書きする場合のみ選択）</label>
            <select id="member-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
              <option value="">🏢 グループの設定に従う</option>
            </select>
          </div>

          <!-- 拠点都道府県（上書き用） -->
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">メイン活動拠点（グループ設定を上書きする場合のみ選択）</label>
            <select id="member-prefecture" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
              <option value="">📍 グループの設定に従う</option>
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <!-- 𝕏 (Twitter) URL -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">𝕏 (Twitter) URL</label>
            <input type="text" id="member-x-url" placeholder="https://x.com/username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500 text-slate-200">
          </div>

          <!-- 状態 -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">状態</label>
            <div class="flex space-x-4 text-sm">
              <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="member-status" value="active" checked class="accent-pink-500"> <span>現役</span></label>
              <label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="member-status" value="graduated" class="accent-pink-500"> <span>卒業 / 離籍</span></label>
            </div>
          </div>
        </section>

        <!-- ================================================= -->
        <!-- 🎨 2. 詳細設定セクション (カラー・属性・記念日)    -->
        <!-- ================================================= -->
        <section id="sec-detail" class="space-y-4 pt-3 border-t border-slate-800">
          <div class="flex items-center gap-2 pb-1 border-b border-slate-800">
            <span class="text-sm">🎨</span>
            <h4 class="text-xs font-extrabold text-amber-400 tracking-wide uppercase">2. 詳細設定 (カラー・属性・記念日)</h4>
          </div>

          <!-- 担当カラーカテゴリ（タップ選択パレット） -->
          <div>
            <label class="block text-xs text-slate-400 mb-1.5">担当カラー系統</label>
            <input type="hidden" id="member-color-category" value="">
            
            <div class="grid grid-cols-5 gap-1.5 text-xs" id="color-category-selector">
              <button type="button" onclick="selectColorCategory('')" data-color="" class="color-cat-btn py-1.5 px-2 bg-slate-800 border-2 border-pink-500 rounded-lg flex items-center justify-center gap-1 text-slate-300 font-bold">
                🚫 なし
              </button>
              <button type="button" onclick="selectColorCategory('red')" data-color="red" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-red-500">
                🔴 赤
              </button>
              <button type="button" onclick="selectColorCategory('blue')" data-color="blue" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-blue-500">
                🔵 青
              </button>
              <button type="button" onclick="selectColorCategory('green')" data-color="green" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-emerald-500">
                🟢 緑
              </button>
              <button type="button" onclick="selectColorCategory('yellow')" data-color="yellow" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-amber-400">
                🟡 黄
              </button>
              <button type="button" onclick="selectColorCategory('pink')" data-color="pink" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-pink-500">
                🩷 桃
              </button>
              <button type="button" onclick="selectColorCategory('purple')" data-color="purple" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-purple-500">
                💜 紫
              </button>
              <button type="button" onclick="selectColorCategory('orange')" data-color="orange" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-orange-500">
                🟠 橙
              </button>
              <button type="button" onclick="selectColorCategory('white')" data-color="white" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-slate-300">
                ⚪ 白
              </button>
              <button type="button" onclick="selectColorCategory('black')" data-color="black" class="color-cat-btn py-1.5 px-2 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center gap-1 hover:border-slate-500">
                ⚫ 黒
              </button>
            </div>
          </div>

          <!-- 担当カラー名（自由記入） -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">詳細カラー名 (自由記入)</label>
            <input type="text" id="member-color-name" placeholder="例: ミントグリーン, パッションレッド" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>

          <!-- 属性タグ -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">属性タグ (カンマ区切り)</label>
            <input type="text" id="member-tags" placeholder="例: 黒髪, ボブ, ショート" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-500">
          </div>

          <!-- 💡 誕生日（月日のみ選択） & デビュー日（西暦ありカレンダー） -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-slate-400 mb-1">🎂 誕生日 (月日のみ)</label>
              <div class="grid grid-cols-2 gap-1">
                <select id="member-birth-month" class="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                  <option value="">月なし</option>
                  <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
                  <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
                  <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
                  <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
                <select id="member-birth-day" class="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                  <option value="">日なし</option>
                  <!-- 1〜31日 -->
                  <option value="01">1日</option><option value="02">2日</option><option value="03">3日</option>
                  <option value="04">4日</option><option value="05">5日</option><option value="06">6日</option>
                  <option value="07">7日</option><option value="08">8日</option><option value="09">9日</option>
                  <option value="10">10日</option><option value="11">11日</option><option value="12">12日</option>
                  <option value="13">13日</option><option value="14">14日</option><option value="15">15日</option>
                  <option value="16">16日</option><option value="17">17日</option><option value="18">18日</option>
                  <option value="19">19日</option><option value="20">20日</option><option value="21">21日</option>
                  <option value="22">22日</option><option value="23">23日</option><option value="24">24日</option>
                  <option value="25">25日</option><option value="26">26日</option><option value="27">27日</option>
                  <option value="28">28日</option><option value="29">29日</option><option value="30">30日</option>
                  <option value="31">31日</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">🚀 デビュー / 加入日</label>
              <input type="date" id="member-debut-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
            </div>
          </div>
        </section>

        <!-- ================================================= -->
        <!-- 🔒 3. 自分メモ (あなた専用の設定)                 -->
        <!-- ================================================= -->
        <section id="sec-personal" class="space-y-4 pt-3 border-t border-slate-800">
          <div class="flex items-center gap-2 pb-1 border-b border-slate-800">
            <span class="text-sm">🔒</span>
            <h4 class="text-xs font-extrabold text-cyan-400 tracking-wide uppercase">3. 自分メモ (あなた専用)</h4>
          </div>

          <!-- 非表示フラグ -->
          <div>
            <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 p-2.5 rounded-xl border border-slate-800">
              <input type="checkbox" id="member-is-hidden" class="accent-pink-500 rounded">
              <span class="text-xs text-slate-300 font-bold">🚫 一覧画面でこのメンバーを非表示にする</span>
            </label>
          </div>

          <!-- 出会った日 -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">🤝 出会った日 / 推し始めた日</label>
            <input type="date" id="member-met-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
          </div>

          <!-- 個人メモ -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">📝 自分用メモ</label>
            <textarea id="member-my-memo" rows="2" placeholder="例: 初チェキポーズはピース。〇〇のイベントで認知もらった" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-500 text-slate-200 resize-none"></textarea>
          </div>
        </section>

        <!-- ボタン類 -->
        <div class="flex space-x-2 pt-3 border-t border-slate-800 sticky bottom-0 bg-slate-900 pb-1">
          <button type="button" onclick="closeMemberModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-bold transition">キャンセル</button>
          <button type="submit" id="save-btn" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== モーダル2: グループ登録・編集 (貼り付け対応) ==================== -->
  <div id="group-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 id="group-modal-title" class="font-bold text-md text-purple-400">グループ / 店舗を追加</h3>
        <button onclick="closeGroupModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="group-form" onsubmit="saveGroup(event)" class="space-y-3">
        <input type="hidden" id="group-id">
        
        <!-- グループ名 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">名称 <span class="text-pink-500">*</span></label>
          <input type="text" id="group-name" required placeholder="例: 〇〇少女隊" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-purple-500">
        </div>

        <!-- グループ画像（ペースト対応） -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">グループ画像 (ロゴ / 集合写真)</label>
          <div id="group-paste-area" class="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl p-3 text-center cursor-pointer transition relative bg-slate-950">
            <img id="group-image-preview" class="max-h-32 mx-auto rounded-lg mb-2 hidden object-cover" src="" alt="group preview">
            <div id="group-upload-placeholder" class="space-y-1">
              <div class="text-xl">🖼️</div>
              <p class="text-xs text-slate-300 font-bold">ファイルをドロップ または 長押しペースト</p>
              <p class="text-[10px] text-slate-500">クリックしてファイルを選択</p>
            </div>
            <input type="file" id="group-image-file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleGroupFileSelect(event)">
          </div>
          <button type="button" onclick="pasteFromClipboard('group')" class="mt-2 w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg border border-slate-700 transition">
            📋 クリップボードから画像を貼り付け
          </button>
        </div>

        <!-- 区分 -->
        <div>
          <label class="block text-xs text-slate-400 mb-1">区分</label>
          <select id="group-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none text-slate-200">
            <option value="idol">アイドル</option>
            <option value="concept_cafe">コンカフェ</option>
            <option value="other">その他</option>
          </select>
        </div>

        <!-- 拠点 & エリア補足 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">拠点都道府県</label>
            <select id="group-prefecture" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs focus:outline-none text-slate-200">
              <option value="東京都">東京都</option>
              <option value="大阪府">大阪府</option>
              <option value="愛知県">愛知県</option>
              <option value="福岡県">福岡県</option>
              <option value="北海道">北海道</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">エリア補足</label>
            <input type="text" id="group-area-note" placeholder="例: 秋葉原" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs focus:outline-none">
          </div>
        </div>

        <!-- ボタン -->
        <div class="flex space-x-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeGroupModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-bold">キャンセル</button>
          <button type="button" onclick="saveGroup(event)" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded-xl text-xs transition">登録・保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
