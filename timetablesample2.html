<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アイドルライブ・結果発表フライヤー</title>
<style>
  body {
    background-color: #fff0f5; /* ふんわりしたパステルピンクの背景 */
    color: #444;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  /* フライヤー全体のコンテナ（アイドル風のポップ＆キュートな枠） */
  .flyer-container {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(135deg, #ffffff 0%, #fff5f8 100%);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(255, 150, 180, 0.3);
    border: 4px solid #ffb6c1;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* 背景のほんのりとしたキラキラ演出 */
  .flyer-container::before {
    content: "★ ♫ ♡ ★ ♫ ♡";
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 14px;
    color: #ffb6c1;
    opacity: 0.5;
    letter-spacing: 4px;
  }

  /* イベントロゴエリア */
  .flyer-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .flyer-title {
    font-size: 22px;
    font-weight: 900;
    color: #ff4081;
    text-shadow: 2px 2px 0px #ffe4e1;
    margin: 0 0 6px 0;
    letter-spacing: 1px;
  }
  .flyer-subtitle {
    font-size: 11px;
    background: #fff0f5;
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    color: #ff69b4;
    font-weight: bold;
    border: 1px dashed #ffb6c1;
  }

  /* 主催（メイン）グループの大きな表示枠 */
  .main-host-section {
    background: #ffffff;
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 16px;
    border: 3px solid #ffb6c1;
    display: flex;
    gap: 16px;
    align-items: center;
    box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
  }
  .host-img {
    width: 85px;
    height: 85px;
    border-radius: 16px;
    object-fit: cover;
    border: 3px solid #ff69b4;
    flex-shrink: 0;
  }
  .host-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .host-badge {
    background: #ff69b4;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 10px;
    width: fit-content;
  }
  .host-name {
    font-size: 16px;
    font-weight: 900;
    color: #333;
  }
  .host-time {
    font-size: 12px;
    color: #ff4081;
    font-weight: bold;
  }

  /* ゲストグループ（写真＋時間が下に並ぶグリッド） */
  .guest-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .guest-card {
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid #e0f7fa; /* パステルブルーのアクセント */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
  }
  .guest-img-wrapper {
    position: relative;
    width: 100%;
    height: 110px;
  }
  .guest-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* 写真の上の時間バッジ（アイドルらしく丸みを強く） */
  .guest-time-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(255, 105, 180, 0.9);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .guest-details {
    padding: 8px;
    text-align: center;
  }
  .guest-name {
    font-size: 12px;
    font-weight: bold;
    color: #444;
    margin-bottom: 2px;
  }
  .guest-tag {
    font-size: 9px;
    color: #888;
    background: #f5f5f5;
    padding: 1px 6px;
    border-radius: 4px;
    display: inline-block;
  }
</style>
</head>
<body>

  <div class="flyer-container">
    
    <!-- イベントタイトル -->
    <div class="flyer-header">
      <h1 class="flyer-title">♡ ぴゅあぴゅあアイドル祭 ♡</h1>
      <span class="flyer-subtitle">✨ 最高の推しメン大集合スペシャル ✨</span>
    </div>

    <!-- 主催グループ（メイン） -->
    <div class="main-host-section">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="host-img" alt="主催グループ">
      <div class="host-info">
        <span class="host-badge">HOST IDOL</span>
        <span class="host-name">チェリー☆ブロッサム</span>
        <span class="host-time">🎵 19:00〜 (トリを務めるよっ！)</span>
      </div>
    </div>

    <!-- ゲストグループエリア -->
    <div class="guest-grid">
      
      <!-- ゲスト1 -->
      <div class="guest-card" style="border-color: #b3e5fc;">
        <div class="guest-img-wrapper">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" class="guest-img" alt="ゲスト1">
          <span class="guest-time-badge" style="background: rgba(3, 169, 244, 0.9);">17:00〜</span>
        </div>
        <div class="guest-details">
          <div class="guest-name">スカイブルー・パレット</div>
          <div class="guest-tag">Cool ｜ 1st Stage</div>
        </div>
      </div>

      <!-- ゲスト2 -->
      <div class="guest-card" style="border-color: #ffe0b2;">
        <div class="guest-img-wrapper">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80" class="guest-img" alt="ゲスト2">
          <span class="guest-time-badge" style="background: rgba(255, 152, 0, 0.9);">18:00〜</span>
        </div>
        <div class="guest-details">
          <div class="guest-name">ハニー☆ドロップス</div>
          <div class="guest-tag">Passion ｜ 2nd Stage</div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
