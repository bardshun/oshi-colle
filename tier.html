<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier表作成 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas (画像保存用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-900 text-white h-[100dvh] flex flex-col overflow-hidden">
  
  <!-- 全画面共通ヘッダー（スマホ対応・ハンバーガーメニュー集約版） -->
  <header id="app-header"></header>
  <header class="bg-gray-800 border-b border-gray-700 px-3 sm:px-4 py-2 sticky top-0 z-50 shrink-0">
    <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
      
      <!-- タイトルエリア -->
      <div class="flex items-center space-x-1.5 shrink-0">
        <a href="index.html" class="text-gray-400 hover:text-white transition text-xs sm:text-sm">🏠</a>
        <h1 class="text-xs sm:text-base font-bold text-pink-500 whitespace-nowrap">📊 Tier表作成</h1>
      </div>

      <!-- 右側操作エリア（1行固定） -->
      <div class="flex items-center gap-2 shrink-0">
        
        <!-- 💾 一番使うDB保存ボタン（表に常駐） -->
        <button onclick="openSaveModal()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 whitespace-nowrap">
          <span>💾</span> 保存
        </button>

        <!-- 🍔 ハンバーガーメニューボタン ＆ ドロップダウン -->
        <div class="relative">
          <button id="tier-menu-toggle-btn" onclick="toggleTierMenu(event)" class="p-1.5 sm:p-2 bg-gray-700 hover:bg-gray-600 text-gray-200 border border-gray-600 rounded-lg transition flex items-center justify-center">
            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>

          <!-- ドロップダウンメニュー本文 -->
          <div id="tier-dropdown-menu" class="absolute right-0 mt-2 w-52 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl py-1 z-50 hidden">
            
            <!-- ランク追加 -->
            <button onclick="execMenuAction('addRank')" class="w-full text-left px-4 py-2.5 text-xs text-gray-200 hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="text-base">➕</span> ランク追加
            </button>

            <!-- 読み込み -->
            <button onclick="execMenuAction('openLoad')" class="w-full text-left px-4 py-2.5 text-xs text-gray-200 hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="text-base">📂</span> 読み込み（保存一覧）
            </button>

            <!-- 全体確認＆画像保存（旧: openTierPreviewModal） -->
            <button onclick="execMenuAction('openPreview')" class="w-full text-left px-4 py-2.5 text-xs text-gray-200 hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="text-base">🔍</span> 全体確認 ＆ 画像保存
            </button>

            <div class="border-t border-gray-700 my-1"></div>

            <!-- リセット（危険操作） -->
            <button onclick="execMenuAction('resetTier')" class="w-full text-left px-4 py-2.5 text-xs text-red-400 hover:bg-red-500/10 flex items-center gap-2.5 font-bold transition">
              <span class="text-base">🔄</span> リセット
            </button>
          </div>
        </div>

      </div>
    </div>
  </header>
  <!-- 💡 メインコンテンツエリア -->
  <main class="max-w-4xl mx-auto p-2.5 sm:p-4 pb-3 flex flex-col flex-1 min-h-0 w-full space-y-2.5 overflow-hidden">
    
    <!-- Tier表メインボード (上半部: 比率6 / 内部スクロール) -->
    <div class="flex-[6] min-h-0 flex flex-col bg-black/40 p-2.5 rounded-xl border border-gray-800 overflow-hidden shadow-inner">
      <div id="tier-container" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        <!-- JavaScriptで動的にランク行を生成します -->
      </div>
    </div>

    <!-- 未配置メンバーのプールエリア (下半部: 比率4 / 内部スクロール) -->
    <div class="flex-[4] min-h-0 bg-gray-800 p-3 rounded-xl border border-gray-700 flex flex-col overflow-hidden space-y-2 shadow-lg">
      
      <!-- ヘッダー＆アコーディオン開閉ボタン -->
      <div class="flex justify-between items-center border-b border-gray-700 pb-1.5 shrink-0">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-xs sm:text-sm text-gray-300">👥 未配置のメンバー</h3>
          <span id="pool-count" class="text-[10px] sm:text-xs text-gray-400">0名</span>
        </div>

        <!-- アコーディオン開閉トグルボタン -->
        <button id="toggle-filter-btn" onclick="toggleFilterAccordion()" class="text-[11px] bg-gray-900 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition">
          <span>🔍 絞り込み・並び替え</span>
          <span id="filter-status-badge" class="hidden w-2 h-2 rounded-full bg-pink-500"></span>
          <span id="accordion-arrow" class="text-[9px] text-gray-400">▼</span>
        </button>
      </div>

      <!-- アコーディオンコンテンツ (初期状態は hidden で折りたたみ) -->
      <div id="filter-accordion-content" class="hidden flex flex-col space-y-1.5 pt-1 border-b border-gray-700/60 pb-2 shrink-0 transition-all duration-200">
        <div class="flex flex-wrap items-center justify-between gap-1.5 text-xs">
          <!-- フィルター群 -->
          <div class="flex flex-wrap gap-1.5">
            <!-- 拠点 -->
            <select id="tier-branch-filter" onchange="handleBranchChange()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 focus:outline-none text-gray-300 text-[11px]">
              <option value="">🌐 すべての拠点</option>
            </select>

            <!-- グループ -->
            <select id="tier-group-filter" onchange="filterPoolMembers()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 focus:outline-none text-gray-300 text-[11px]">
              <option value="">🏢 すべてのグループ</option>
            </select>

            <!-- 区分 -->
            <select id="tier-category-filter" onchange="filterPoolMembers()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 focus:outline-none text-gray-300 text-[11px]">
              <option value="">🏷️ すべての区分</option>
            </select>
          </div>

          <!-- ソート群 -->
          <div class="flex gap-1">
            <button id="sort-ruby-btn" onclick="toggleSort('ruby')" class="bg-gray-900 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 py-1 rounded-lg text-[11px] flex items-center gap-1 transition">
              🔤 名前 <span id="sort-ruby-icon">▼</span>
            </button>
            <button id="sort-group-btn" onclick="toggleSort('group')" class="bg-gray-900 hover:bg-gray-700 border border-gray-700 text-gray-300 px-2 py-1 rounded-lg text-[11px] flex items-center gap-1 transition">
              🏢 グループ <span id="sort-group-icon">▼</span>
            </button>
          </div>
        </div>
      </div>

      <!-- メンバープールエリア -->
      <div id="member-pool" 
          onclick="handlePoolClick(event)"
          ondrop="dropToPool(event)" 
          ondragover="allowDrop(event)" 
          class="flex-1 overflow-y-auto bg-gray-900/80 p-2 rounded-lg border border-dashed border-gray-700 flex flex-wrap gap-2 items-start custom-scrollbar">
        <!-- 未配置カードが入ります -->
      </div>
    </div>

  </main>

  <!-- 🏆 Tier表 全体確認 ＆ 画像保存モーダル -->
  <div id="tier-preview-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <!-- モーダルヘッダー -->
      <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-gray-950">
        <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
          <span>🖼️</span> Tier表 プレビュー
        </h3>
        <div class="flex items-center gap-2">
          <button onclick="downloadTierImage()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1 shadow-md">
            <span>💾</span> 画像として保存
          </button>
          <button onclick="closeTierPreviewModal()" class="text-gray-400 hover:text-white text-lg px-2">✕</button>
        </div>
      </div>

      <!-- プレビューキャプチャ対象エリア (全体横スクロール対応) -->
      <div class="p-4 overflow-auto bg-gray-950 flex-1 flex justify-start items-start">
        <div id="tier-export-target" class="w-max min-w-[950px] bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2 shadow-2xl">
          <!-- JavaScriptで出力用Tier表全体をレンダリング -->
        </div>
      </div>
    </div>
  </div>
  
  <!-- 💾 保存モーダル -->
  <div id="save-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        💾 Tier表を保存
      </h3>
      <div>
        <label class="block text-xs text-gray-400 mb-1">タイトル</label>
        <input type="text" id="save-title-input" placeholder="例: 2026春推し顔Tier" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
      </div>

      <div id="save-limit-warning" class="text-xs text-amber-400 bg-amber-500/10 p-2.5 rounded-lg border border-amber-500/20 hidden">
        ⚠️ 保存数が上限（20件）に達しています。既存のリストを上書きするか削除してください。
      </div>

      <div class="flex gap-2 justify-end pt-2">
        <button onclick="closeSaveModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 text-xs rounded-lg transition">
          キャンセル
        </button>
        <button id="exec-save-btn" onclick="handleExecSave()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold rounded-lg transition">
          保存する
        </button>
      </div>
    </div>
  </div>

  <!-- 📂 保存一覧・呼出モーダル -->
  <div id="load-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          📂 保存済みTier表一覧
          <span id="saved-count-badge" class="text-xs bg-gray-700 px-2 py-0.5 rounded-full text-pink-400 font-mono">0/20</span>
        </h3>
        <button onclick="closeLoadModal()" class="text-gray-400 hover:text-white text-lg">✕</button>
      </div>

      <!-- リスト一覧コンテナ -->
      <div id="saved-list-container" class="max-h-80 overflow-y-auto space-y-2 pr-1">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/tier.js"></script>
</body>
</html>
