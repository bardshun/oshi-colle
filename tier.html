<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier表作成 - 推しコレ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas (画像保存用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">
  
  <!-- 全画面共通ヘッダー（折り返し対応 ＆ shrink-0で高さを自動追従） -->
  <header class="bg-gray-800 border-b border-gray-700 p-3 sticky top-0 z-50 shrink-0">
    <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center space-x-2">
        <a href="index.html" class="text-gray-400 hover:text-white transition text-sm">🏠</a>
        <h1 class="text-base sm:text-xl font-bold text-pink-500 whitespace-nowrap">📊 Tier表作成</h1>
      </div>
      <div class="flex space-x-1.5 shrink-0">
        <button onclick="openTierPreviewModal()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold text-[11px] sm:text-xs px-2.5 py-1.5 rounded-lg border border-purple-500 shadow-md transition flex items-center gap-1">
          <span>🔍</span> 全体確認 ＆ 保存
        </button>
        <button onclick="addTierRow()" class="bg-gray-700 hover:bg-gray-600 text-[11px] sm:text-xs px-2.5 py-1.5 rounded-lg border border-gray-600 transition whitespace-nowrap">
          ＋ ランク追加
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ (残りの画面高さを自動で100%占有 ＆ 上下6:4分割) -->
  <main class="max-w-4xl mx-auto p-3 flex flex-col flex-1 min-h-0 w-full space-y-3 overflow-hidden">
    
    <!-- Tier表メインボード (上半部: 比率6 / 内部スクロール) -->
    <div class="flex-[6] min-h-0 flex flex-col bg-black/40 p-2.5 rounded-xl border border-gray-800 overflow-hidden shadow-inner">
      <div id="tier-container" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        <!-- JavaScriptで動的にランク行を生成します -->
      </div>
    </div>

    <!-- 未配置メンバーのプールエリア (下半部: 比率4 / 内部スクロール) -->
    <div class="flex-[4] min-h-0 bg-gray-800 p-3 rounded-xl border border-gray-700 flex flex-col overflow-hidden space-y-2 shadow-lg">
      <div class="flex justify-between items-center border-b border-gray-700 pb-1.5 shrink-0">
        <h3 class="font-bold text-xs sm:text-sm text-gray-300">👥 未配置のメンバー</h3>
        <span id="pool-count" class="text-[10px] sm:text-xs text-gray-400">0名</span>
      </div>

      <!-- フィルター -->
      <div class="flex space-x-2 text-xs shrink-0">
        <select id="tier-group-filter" onchange="filterPoolMembers()" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1 focus:outline-none text-gray-300 text-[11px]">
          <option value="">🏢 すべてのグループ</option>
        </select>
      </div>

      <!-- メンバープール（ドラッグ元・タップ選択元） -->
      <div id="member-pool" ondrop="dropToPool(event)" ondragover="allowDrop(event)" 
           class="flex-1 overflow-y-auto bg-gray-900/80 p-2 rounded-lg border border-dashed border-gray-700 flex flex-wrap gap-2 items-start custom-scrollbar">
        <!-- 未配置カードがここに入ります -->
      </div>
    </div>

  </main>

  <!-- 🏆 Tier表 全体確認 ＆ 画像保存モーダル -->
  <div id="tier-preview-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <!-- モーダルヘッダー -->
      <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-gray-950">
        <h3 class="font-bold text-sm text-gray-100 flex items-center gap-2">
          <span>🖼️</span> Tier表 プレビュー
        </h3>
        <div class="flex items-center gap-2">
          <button onclick="downloadTierImage()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1 shadow-md">
            <span>💾</span> 画像として保存
          </button>
          <button onclick="closeTierPreviewModal()" class="text-gray-400 hover:text-white text-lg px-2">✕</button>
        </div>
      </div>

      <!-- プレビューキャプチャ対象エリア -->
      <div class="p-4 overflow-y-auto bg-gray-950 flex-1 flex justify-center items-start">
        <div id="tier-export-target" class="w-full bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
          <!-- JavaScriptで出力用Tier表全体をレンダリング -->
        </div>
      </div>
    </div>
  </div>

  <!-- スクリプトの読み込み -->
  <script src="js/common.js"></script>
  <script src="js/tier.js"></script>
</body>
</html>
