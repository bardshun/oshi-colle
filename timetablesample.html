<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>対バンライブ・タイムテーブル結果発表</title>
<style>
  /* ==========================================
     テーマ設定（CSS変数）
     ========================================== */
  /* 【テーマ1：ポップフェス (pop)】 */
  :root, [data-theme="pop"] {
    --bg-color: #1a1c29;
    --panel-bg: #2b2d42;
    --text-main: #ffffff;
    --text-sub: #a0a5c0;
    --accent-color: #ff4081;
    --header-bg: linear-gradient(135deg, #ff75a0, #ffa726);
    --card-border: rgba(255, 255, 255, 0.1);
    --font-family: 'M PLUS Rounded 1c', sans-serif;
  }

  /* 【テーマ2：シック・ライブハウス (livehouse)】 */
  [data-theme="livehouse"] {
    --bg-color: #0d0e15;
    --panel-bg: #161824;
    --text-main: #e0e0e0;
    --text-sub: #787d9b;
    --accent-color: #00e5ff;
    --header-bg: linear-gradient(135deg, #2a0845, #6441a5);
    --card-border: rgba(0, 229, 255, 0.2);
    --font-family: 'Helvetica Neue', sans-serif;
  }

  /* 【テーマ3：王道アイドル (idol)】 */
  [data-theme="idol"] {
    --bg-color: #fff0f5;
    --panel-bg: #ffffff;
    --text-main: #444444;
    --text-sub: #888888;
    --accent-color: #ff69b4;
    --header-bg: linear-gradient(135deg, #ffb6c1, #ffc0cb);
    --card-border: #ffe4e1;
    --font-family: 'M PLUS Rounded 1c', sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-family);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    transition: all 0.3s ease;
  }

  /* タイムテーブルの全体容器 */
  .timetable-container {
    width: 100%;
    max-width: 500px;
    background: var(--panel-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
  }

  /* イベントヘッダー */
  .event-header {
    background: var(--header-bg);
    padding: 24px 20px;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .event-title {
    font-size: 22px;
    font-weight: 900;
    margin: 0;
    letter-spacing: 1px;
  }
  .event-subtitle {
    font-size: 12px;
    margin-top: 6px;
    opacity: 0.9;
  }

  /* タイムラインリスト */
  .timetable-list {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  /* 左側のタイムライン縦線 */
  .timetable-list::before {
    content: "";
    position: absolute;
    left: 85px;
    top: 30px;
    bottom: 30px;
    width: 3px;
    background: var(--card-border);
  }

  /* 各出演枠（カード） */
  .timetable-item {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  /* 出演時間バッジ */
  .item-time {
    width: 65px;
    font-size: 13px;
    font-weight: bold;
    text-align: right;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  /* 出演グループカード本体 */
  .item-card {
    flex-grow: 1;
    background: rgba(255, 255, 255, 0.05);
    border-left: 5px solid var(--group-color, var(--accent-color));
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    background-color: var(--panel-bg);
    border-top: 1px solid var(--card-border);
    border-right: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
  }

  /* グループ画像 */
  .group-img {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
  }

  /* グループ詳細 */
  .group-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .group-name {
    font-size: 15px;
    font-weight: bold;
    color: var(--text-main);
  }
  .group-comment {
    font-size: 11px;
    color: var(--text-sub);
  }
  .group-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--group-color, var(--accent-color));
    color: #fff;
    width: fit-content;
    margin-bottom: 2px;
  }
</style>
</head>
<!-- data-theme を "pop", "livehouse", "idol" に変更することで雰囲気が一変します -->
<body data-theme="pop">

  <div class="timetable-container">
    <!-- イベントヘッダー（プレイヤーが名付けたイベント名など） -->

    </div>

    <!-- タイムテーブル本体 -->
    <div class="timetable-list">

      <!-- 出演枠1 -->
      <div class="timetable-item">
        <div class="item-time">12:00〜</div>
        <div class="item-card" style="--group-color: #ff75a0;">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" class="group-img" alt="グループ1">
          <div class="group-info">

      <div class="timetable-item">

          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80" class="group-img" alt="グループ2">
          <div class="group-info">
            <span class="group-tag">Cool</span>
            <span class="group-name">Night Sky Symphony</span>
            <span class="group-comment">「圧倒的な歌唱力を見せつけるステージ。」</span>
          </div>

      </div>

      <!-- 出演枠3 -->
      <div class="timetable-item">
        <div class="item-time">13:30〜</div>
        <div class="item-card" style="--group-color: #ffa726;">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=200&q=80" class="group-img" alt="グループ3">
          <div class="group-info">
            <span class="group-tag">Passion</span>
            <span class="group-name">サンシャイン・ガールズ</span>
            <span class="group-comment">「トリ前！会場の温度を最高潮に！」</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
